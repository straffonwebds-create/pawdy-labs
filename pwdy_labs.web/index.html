<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawdy Labs — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- PAW PRINTS BACKGROUND -->
  <div class="paws" id="paws" aria-hidden="true"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo__box">
        <svg width="18" height="18" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="44" rx="12" ry="9" fill="#49473e"/>
          <ellipse cx="16" cy="30" rx="6" ry="8" fill="#49473e"/>
          <ellipse cx="48" cy="30" rx="6" ry="8" fill="#49473e"/>
          <ellipse cx="22" cy="18" rx="5" ry="6.5" fill="#49473e"/>
          <ellipse cx="42" cy="18" rx="5" ry="6.5" fill="#49473e"/>
        </svg>
      </div>
      <span class="logo__text">PawdyLab</span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <!-- SPINNER -->
    <div class="spinner" aria-label="Cargando">
      <div class="spinner__ring"></div>
    </div>

    <!-- TEXT -->
    <h1 class="loading-text">Loading...</h1>
    <p class="coming-soon">Coming soon 🐾</p>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer__copy">© 2024 PAWDY LABS.</span>
    <nav class="footer__links">
      <a href="#">Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
